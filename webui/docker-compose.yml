# Iris WebUI — single-container Docker Compose
#
# QUICK START (most users):
#   1. (Optional) Copy .env.docker.example to .env and edit values
#   2. docker compose up -d
#   3. Open http://localhost:8787
#
# This is the simplest setup: one WebUI container that runs the agent in-process.
# The WebUI auto-detects host UID/GID from the mounted .iris volume.
#
# For multi-container setups (separate agent + webui or agent+webui+dashboard),
# see docker-compose.two-container.yml or docker-compose.three-container.yml.

services:
  iris-webui:
    build: .
    ports:
    # select only one; use 127.0.0.1 version to expose to localhost only
      - "127.0.0.1:8787:8787"
#      - "8787:8787"
    volumes:
      # Mount your Iris home directory into the container.
      # The default (${HOME}/.iris) works on both macOS (/Users/<you>/.iris)
      # and Linux (/home/<you>/.iris) — no change needed for standard installs.
      # Only set IRIS_HOME explicitly if your .iris lives somewhere non-standard.
      # macOS note: set UID and GID below to match your user ID (run `id -u` and `id -g`).
      - ${IRIS_HOME:-${HOME}/.iris}:/home/iriswebui/.iris
      # Your workspace directory shown on first launch (adapt if yours is different, the container will use the mounted /workspace)
      - ${IRIS_WORKSPACE:-${HOME}/workspace}:/workspace
    environment:
      # Set to your host user ID: run `id -u` and `id -g` to find them.
      # On macOS, UIDs start at 501 (not 1000), so set UID and GID in a .env file:
      #   echo "UID=$(id -u)" >> .env
      #   echo "GID=$(id -g)" >> .env
      # Without this, the container may not be able to read your mounted files.
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      # Required: bind address and port
      - IRIS_WEBUI_HOST=0.0.0.0
      - IRIS_WEBUI_PORT=8787
      # Where to store sessions, workspaces, and other state (default: ~/.iris/webui)
      - IRIS_WEBUI_STATE_DIR=/home/iriswebui/.iris/webui
      # Default workspace directory shown on first launch
#      - IRIS_WEBUI_DEFAULT_WORKSPACE=/workspace
      # Optional: enable password auth. Set IRIS_WEBUI_PASSWORD in .env
      # (required if you expose the port beyond 127.0.0.1).
      - IRIS_WEBUI_PASSWORD=${IRIS_WEBUI_PASSWORD:-}
      #
      # Bind-mount permission handling (fixes #1389, #1399):
      #   When you mount an EXISTING ~/.iris directory (the common case),
      #   the WebUI's startup credential-permission fixer can clash with
      #   your host file modes (e.g. 0640 group-readable .env files).
      #   Set IRIS_SKIP_CHMOD=1 to bypass the fixer entirely, OR set
      #   IRIS_HOME_MODE=0640 to allow group bits while still stripping
      #   world-readable. Both are documented in api/startup.py.
      # - IRIS_SKIP_CHMOD=1
      # - IRIS_HOME_MODE=0640
    restart: unless-stopped
