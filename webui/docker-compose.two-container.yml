# Two-container Docker Compose: Iris Agent + Iris WebUI
#
# QUICK START:
#   docker compose -f docker-compose.two-container.yml up -d
#   Open http://localhost:8787
#
# This runs the agent and web UI in separate containers connected via shared
# Docker volumes. The WebUI installs the agent's Python dependencies from the
# shared agent source volume at startup.
#
# WHEN TO USE THIS:
#   - You want isolation between the agent gateway and the WebUI
#   - You're already running iris-agent in its own container
#   - You don't need the dashboard (use docker-compose.three-container.yml for that)
#
# WHEN NOT TO USE THIS:
#   - You hit "Permission denied" trying to share an existing ~/.iris directory
#     → use docker-compose.yml (single-container) instead, OR
#     → keep this file but switch to NAMED VOLUMES (the default) instead of bind mounts
#   - You're on Podman 3.4 or older without keep-id namespace support
#     → see https://github.com/sunnysktsang/iris-suite for an all-in-one image
#
# KNOWN LIMITATION (#681): tools triggered from the WebUI run in the WebUI
# container, not the agent container. If you need git/node/etc. on the
# WebUI's filesystem, install them in the WebUI image — or use a single-
# container setup where everything lives in one place.
#
# NOTE ON VOLUMES:
#   This file uses named Docker volumes (iris-home, iris-agent-src) which
#   work out of the box on every Docker installation. If you prefer bind mounts
#   to share an existing host directory:
#
#     volumes:
#       iris-home:
#         driver: local
#         driver_opts:
#           type: none
#           o: bind
#           device: /home/youruser/.iris
#
#   When using bind mounts, BOTH containers must mount the same host path,
#   AND your host directory must be readable by UID 1000 (the default). Run:
#     id -u && id -g
#   to find your host UID/GID, then put them in a .env file:
#     echo "UID=$(id -u)" >> .env
#     echo "GID=$(id -g)" >> .env

services:
  iris-agent:
    # [CHANNEL-PENDING] Recommended image once this project publishes its own
    # registry. The old `nousresearch/iris-agent` / `ghcr.io/nesquena/iris-webui`
    # tags are upstream dead links — do NOT pull them. Confirm the published
    # registry + tag before `docker compose up`; see MIRROR.md for the dual-track
    # release hosts.
    image: ghcr.io/x33834/iris-agent:latest
    container_name: iris-agent
    command: gateway run
    ports:
      # Gateway API — exposed on localhost only.
      # Other containers on iris-net reach it via http://iris-agent:8642.
      # Remove 127.0.0.1: to expose on the host network (e.g. for remote clients).
      - "127.0.0.1:8642:8642"
    volumes:
      # Persist config, state, sessions, skills, memory across restarts
      - iris-home:/home/iris/.iris
      # Expose agent source so the WebUI can install dependencies from it
      - iris-agent-src:/opt/iris
    environment:
      - IRIS_HOME=/home/iris/.iris
      # Align UID/GID across containers sharing the iris-home volume.
      # Defaults to 1000 to match WANTED_UID/WANTED_GID in the webui service.
      # The agent image's entrypoint already supports usermod remapping.
      - IRIS_UID=${UID:-1000}
      - IRIS_GID=${GID:-1000}
      # Gateway API server (port 8642). The WebUI's Tasks/cron health probe
      # reaches this listener via IRIS_API_URL below. The agent only starts
      # the listener when API_SERVER_KEY is a usable value (>=16 chars); set
      # it in .env to enable the gateway API. Without a key the gateway daemon
      # still runs (messaging + cron) but port 8642 stays unbound and the
      # WebUI reports "Gateway endpoint not reachable".
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      # Bind-mount permission handling for the agent — narrow set of overrides.
      # NOTE: The agent's IRIS_HOME_MODE applies to the IRIS_HOME *directory*
      # mode (default 0700) — NOT to credential files like the WebUI's variant.
      # If you set this, you MUST keep the owner-execute bit so the agent can
      # traverse its own home directory. 0640 BREAKS the agent (no x bit → no
      # traversal). Use 0750 for group-traversable or 0701 for x-only.
      # The agent's container detection (/.dockerenv) already auto-skips
      # credential chmod inside Docker, so IRIS_SKIP_CHMOD is redundant here.
      # - IRIS_HOME_MODE=0750
    restart: unless-stopped
    networks:
      - iris-net

  iris-webui:
    # [CHANNEL-PENDING] Recommended WebUI image once this project publishes its
    # own registry. The old `ghcr.io/nesquena/iris-webui` tag is an upstream
    # dead link. Confirm the published registry + tag before `docker compose up`.
    image: ghcr.io/x33834/iris-webui:latest
    container_name: iris-webui
    depends_on:
      - iris-agent
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Same iris home as the agent — shares config, sessions, state
      - iris-home:/home/iriswebui/.iris
      # Agent source mounted where docker_init.bash expects it.
      # Mounted read-only — the WebUI only reads this volume to install
      # the agent's Python dependencies at startup (`uv pip install`).
      # Read-only enforces that defence-in-depth at the kernel layer.
      - iris-agent-src:/home/iriswebui/.iris/iris-agent:ro
      # Workspace directory — browse and edit files from the WebUI.
      # Adapt the host path to your project directory.
      # Override with: IRIS_WORKSPACE=/your/path docker compose up
      # ${HOME} is used rather than `~` so the default resolves the same way
      # across Linux, macOS, WSL2, and Docker Desktop on Windows.
      - ${IRIS_WORKSPACE:-${HOME}/workspace}:/workspace
    environment:
      - IRIS_WEBUI_HOST=0.0.0.0
      - IRIS_WEBUI_PORT=8787
      - IRIS_WEBUI_STATE_DIR=/home/iriswebui/.iris/webui
      # Let the WebUI health/status checks reach the gateway container over
      # the compose network. Cron listing is local, but scheduled ticking and
      # the Tasks/System gateway pill need a reachable gateway URL (#4483).
      - IRIS_API_URL=http://iris-agent:8642
      # Match your host user's UID/GID for correct file permissions.
      # In two-container setups the WebUI auto-detects UID/GID from the shared
      # iris-home volume, but you can override explicitly if needed (#668):
      # Run `id -u` and `id -g` to find your values.
      # On macOS, UIDs start at 501 — set these in a .env file:
      #   echo "UID=$(id -u)" >> .env && echo "GID=$(id -g)" >> .env
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      # Forward the API server key so the WebUI's gateway health probe can
      # authenticate (must match the agent's API_SERVER_KEY above).
      - IRIS_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY:-}
      # Optional: enable password auth. Set IRIS_WEBUI_PASSWORD in .env
      # (required if you expose the port beyond 127.0.0.1).
      - IRIS_WEBUI_PASSWORD=${IRIS_WEBUI_PASSWORD:-}
      # Bind-mount permission handling for the WebUI (fixes #1389, #1399).
      # NOTE: WebUI's IRIS_HOME_MODE is a credential-file threshold (allow
      # group bits on .env/.signing_key/etc.), DIFFERENT from the agent's
      # which applies to the IRIS_HOME directory itself. 0640 is correct
      # for the WebUI; do NOT copy this value to the agent service block.
      # - IRIS_SKIP_CHMOD=1
      # - IRIS_HOME_MODE=0640
    restart: unless-stopped
    networks:
      - iris-net

networks:
  iris-net:
    driver: bridge

volumes:
  # IMPORTANT — upgrading the agent image:
  #   The `iris-agent-src` volume is initialised from the agent image's
  #   `/opt/iris` on first `up`, and Docker reuses the volume verbatim on
  #   later runs — even after `docker pull` of a newer agent image. After
  #   upgrading the agent image, run:
  #
  #     docker compose down
  #     docker volume rm <project>_iris-agent-src
  #     docker compose pull
  #     docker compose up -d
  #
  #   The full procedure (and why) is documented in docs/docker.md.
  iris-home:
  iris-agent-src:
